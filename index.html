<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>¡Vamos! — Sprachen lernen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/stil.css">
</head>
<body>

<!-- =================== KOPFZEILE =================== -->
<header id="kopf">
  <button class="kopf-btn" id="btn-zurueck" hidden data-t-aria="allg.zurueck">←</button>
  <div id="kopf-titel">¡Vamos!</div>
  <div id="kopf-kurs" class="kopf-kurs" hidden></div>
  <div id="kopf-fortschritt" hidden>
    <div class="balken"><div class="balken-fuell" id="balken-fuell"></div></div>
    <span id="balken-text">0/0</span>
  </div>
  <button class="kopf-btn" id="btn-menue" data-t-aria="allg.menue">☰</button>
</header>

<!-- =================== HAUPTBEREICH =================== -->
<main id="haupt">

  <!-- ---------- Kursauswahl ---------- -->
  <section class="seite" id="seite-kurse" hidden>
    <h2 data-t="kurs.titel">Welche Sprache?</h2>
    <p class="hinweis" data-t="kurs.hinweis"></p>
    <div id="kursliste"></div>
  </section>

  <!-- ---------- Startbildschirm ---------- -->
  <section class="seite" id="seite-start" hidden>
    <div class="streak-box">
      <div class="streak-zahl"><span id="stat-streak">0</span><span class="streak-flamme">🔥</span></div>
      <div class="streak-label" data-t="start.streak">Tage in Folge</div>
    </div>

    <div class="kachel-gitter">
      <div class="kachel"><div class="kachel-zahl" id="stat-aktive-tage">0</div><div class="kachel-label" data-t="start.aktiveTage"></div></div>
      <div class="kachel"><div class="kachel-zahl" id="stat-woerter">0</div><div class="kachel-label" data-t="start.woerter"></div></div>
      <div class="kachel"><div class="kachel-zahl" id="stat-genauigkeit">–</div><div class="kachel-label" data-t="start.genauigkeit"></div></div>
      <div class="kachel kachel-warnung" id="kachel-leech"><div class="kachel-zahl" id="stat-leeches">0</div><div class="kachel-label" data-t="start.problemwoerter"></div></div>
    </div>

    <div class="tageskarte" id="tageskarte">
      <div class="tageskarte-kopf">
        <span class="niveau-chip" id="tag-niveau">A2</span>
        <span class="tageskarte-tag" id="tageskarte-tag"></span>
      </div>
      <h2 id="tag-thema">—</h2>
      <p class="tageskarte-gram"><span data-t="start.grammatik"></span> <span id="tag-grammatik">–</span></p>
      <div class="tageskarte-zeilen" id="tageskarte-zeilen"></div>
      <button class="btn btn-gross" id="btn-lernen" data-t="start.lernen"></button>
      <p class="hinweis" id="hinweis-fertig" hidden data-t="start.erledigt"></p>
    </div>

    <button class="wartestreifen" id="wartestreifen" hidden>
      <span class="wartestreifen-text" id="wartestreifen-text"></span>
      <span class="wartestreifen-pfeil">›</span>
    </button>

    <div class="pruefkarte" id="pruefkarte" hidden>
      <div class="pruefkarte-kopf">
        <span class="pruef-chip" id="pruefkarte-niveau">A2</span>
        <span class="pruefkarte-stand" id="pruefkarte-stand"></span>
      </div>
      <h2 id="pruefkarte-name">—</h2>
      <p class="pruefkarte-vorbild" id="pruefkarte-vorbild"></p>
      <button class="btn btn-gross" id="btn-pruefung" data-t="pruef.starten"></button>
    </div>

    <div id="pruefliste" hidden></div>

    <div class="zusatz-knoepfe">
      <button class="btn btn-neben" id="btn-speed" data-t="start.speed"></button>
      <button class="btn btn-neben" id="btn-nur-wdh" data-t="start.nurWdh"></button>
    </div>

    <h3 class="abschnitt-titel" data-t="start.heatmap"></h3>
    <div id="heatmap"></div>
  </section>

  <!-- ---------- Lern-/Übungsbildschirm ---------- -->
  <section class="seite" id="seite-uebung" hidden>
    <div id="uebung-phase" class="phasen-band"></div>
    <div id="uebung-inhalt"></div>
    <div id="uebung-rueckmeldung" class="rueckmeldung" hidden>
      <div class="rueckmeldung-titel" id="rueckmeldung-titel"></div>
      <div class="rueckmeldung-text" id="rueckmeldung-text"></div>
    </div>
    <div class="fussleiste" id="uebung-fuss">
      <button class="btn btn-gross" id="btn-pruefen" data-t="ueb.pruefen"></button>
      <button class="btn btn-gross" id="btn-weiter" hidden data-t="ueb.weiter"></button>
    </div>
  </section>

  <!-- ---------- Abschlussbildschirm ---------- -->
  <section class="seite" id="seite-fertig" hidden>
    <div class="fertig-box">
      <div class="fertig-emoji">🎉</div>
      <h2 id="fertig-titel">¡Muy bien!</h2>
      <p id="fertig-untertitel"></p>
      <div class="kachel-gitter">
        <div class="kachel"><div class="kachel-zahl" id="fertig-aufgaben">0</div><div class="kachel-label" data-t="fertig.aufgaben"></div></div>
        <div class="kachel"><div class="kachel-zahl" id="fertig-quote">0%</div><div class="kachel-label" data-t="fertig.richtig"></div></div>
        <div class="kachel"><div class="kachel-zahl" id="fertig-neu">0</div><div class="kachel-label" data-t="fertig.neueWoerter"></div></div>
        <div class="kachel"><div class="kachel-zahl" id="fertig-streak">0</div><div class="kachel-label" data-t="fertig.streak"></div></div>
      </div>
      <div id="fertig-fehlerliste"></div>
      <button class="btn btn-gross" id="btn-fertig-zurueck" data-t="fertig.zurueck"></button>
    </div>
  </section>

  <!-- ---------- Historie ---------- -->
  <!-- ---------- Prüfung: Übersicht vor dem Start ---------- -->
  <section class="seite" id="seite-pruefung-info" hidden>
    <div class="pruef-info-kopf">
      <span class="pruef-chip" id="pinfo-niveau">A2</span>
      <h2 id="pinfo-name">—</h2>
      <p class="pruef-vorbild" id="pinfo-vorbild"></p>
    </div>

    <div class="pruef-regeln">
      <h3 data-t="pruef.soLaeuftAb"></h3>
      <ul>
        <li data-t="pruef.regel1"></li>
        <li data-t="pruef.regel2"></li>
        <li data-t="pruef.regel3"></li>
        <li data-t="pruef.regel4"></li>
      </ul>
    </div>

    <h3 class="abschnitt-titel" data-t="pruef.teile"></h3>
    <div id="pinfo-teile"></div>

    <div class="pruef-warnung" id="pinfo-hoerwarnung" hidden data-t="pruef.ohneStimme"></div>
    <p class="hinweis" id="pinfo-frueher" hidden></p>

    <button class="btn btn-gross" id="btn-pruefung-los" data-t="pruef.jetztStarten"></button>
    <button class="btn btn-neben" id="btn-pruefung-abbrechen" data-t="pruef.zurueck"></button>
  </section>

  <!-- ---------- Prüfung: laufende Aufgaben ---------- -->
  <section class="seite" id="seite-pruefung" hidden>
    <div class="pruef-leiste">
      <span id="pruef-fortschritt-text"></span>
      <span class="pruef-balken"><span id="pruef-balken-innen"></span></span>
    </div>
    <div id="pruef-inhalt"></div>
    <div class="pruef-navigation">
      <button class="btn btn-neben" id="btn-pruef-zurueck" data-t="pruef.zurueckAufgabe"></button>
      <button class="btn btn-gross" id="btn-pruef-weiter" data-t="pruef.weiter"></button>
    </div>
    <button class="btn btn-gefahr btn-schmal" id="btn-pruef-aufgeben" data-t="pruef.aufgeben"></button>
  </section>

  <!-- ---------- Prüfung: Ergebnis ---------- -->
  <section class="seite" id="seite-pruefung-ergebnis" hidden>
    <div class="pruef-ergebnis-kopf" id="perg-kopf">
      <div class="perg-prozent" id="perg-prozent">0%</div>
      <div class="perg-urteil" id="perg-urteil"></div>
      <div class="perg-punkte" id="perg-punkte"></div>
    </div>

    <h3 class="abschnitt-titel" data-t="pruef.ergebnisTeile"></h3>
    <div id="perg-teile"></div>

    <div id="perg-offen"></div>

    <h3 class="abschnitt-titel" data-t="pruef.durchsicht"></h3>
    <div id="perg-durchsicht"></div>

    <button class="btn btn-gross" id="btn-perg-zurueck" data-t="fertig.zurueck"></button>
  </section>

  <!-- ---------- Prüfer: jemand bewertet einen fremden Text ---------- -->
  <section class="seite" id="seite-pruefer" hidden>
    <div class="pruefer-kopf">
      <h2 id="pruefer-titel">—</h2>
      <p class="pruefer-einleitung" id="pruefer-einleitung"></p>
      <p class="pruefer-kennung" id="pruefer-kennung"></p>
    </div>

    <div id="pruefer-aufgaben"></div>

    <label class="pruefer-feld">
      <span id="pruefer-name-label"></span>
      <input type="text" id="pruefer-name" autocomplete="name">
    </label>

    <p class="hinweis" id="pruefer-meldung" hidden></p>
    <button class="btn btn-gross" id="btn-pruefer-senden"></button>
    <button class="btn btn-neben" id="btn-pruefer-abbrechen"></button>
  </section>

  <section class="seite" id="seite-historie" hidden>
    <h2 data-t="hist.titel"></h2>
    <p class="hinweis" data-t="hist.hinweis"></p>
    <div class="filter-leiste">
      <button class="chip chip-aktiv" data-filter="alle" data-t="hist.alle"></button>
      <button class="chip" data-filter="leech" data-t="hist.nurLeech"></button>
      <button class="chip" data-filter="faellig" data-t="hist.faellig"></button>
    </div>
    <div id="historie-liste"></div>
  </section>

  <!-- ---------- Erinnerung ---------- -->
  <section class="seite" id="seite-erinnerung" hidden>
    <h2 data-t="erin.titel"></h2>
    <div class="info-box">
      <strong data-t="erin.warumTitel"></strong>
      <p data-t-html="erin.warumText"></p>
    </div>

    <h3 data-t="erin.weg1"></h3>
    <ol class="schritte">
      <li data-t-html="erin.weg1s1"></li>
      <li data-t-html="erin.weg1s2"></li>
      <li data-t-html="erin.weg1s3"></li>
    </ol>
    <button class="btn btn-gross" id="btn-ics" data-t="erin.icsKnopf"></button>
    <p class="hinweis" data-t="erin.icsHinweis"></p>

    <h3 data-t="erin.weg2"></h3>
    <ol class="schritte">
      <li data-t-html="erin.weg2s1"></li>
      <li data-t-html="erin.weg2s2"></li>
      <li data-t-html="erin.weg2s3"></li>
      <li data-t-html="erin.weg2s4"></li>
      <li data-t-html="erin.weg2s5"></li>
    </ol>

    <h3 data-t="erin.installTitel"></h3>
    <ol class="schritte">
      <li data-t-html="erin.installS1"></li>
      <li data-t-html="erin.installS2"></li>
      <li data-t-html="erin.installS3"></li>
    </ol>
  </section>

  <!-- ---------- Einstellungen ---------- -->
  <section class="seite" id="seite-einstellungen" hidden>
    <h2 data-t="einst.titel"></h2>

    <div class="einst-zeile">
      <label for="ein-ton" data-t="einst.ton"></label>
      <input type="checkbox" id="ein-ton" class="schalter">
    </div>
    <p class="hinweis" id="stimme-status"></p>

    <div class="einst-zeile">
      <label for="ein-thema" data-t="einst.darstellung"></label>
      <select id="ein-thema">
        <option value="auto" data-t="einst.auto"></option>
        <option value="hell" data-t="einst.hell"></option>
        <option value="dunkel" data-t="einst.dunkel"></option>
      </select>
    </div>

    <div class="einst-zeile">
      <label for="ein-ziel" data-t="einst.ziel"></label>
      <select id="ein-ziel">
        <option value="15" data-t="einst.zielKurz"></option>
        <option value="25" data-t="einst.zielNormal"></option>
        <option value="40" data-t="einst.zielIntensiv"></option>
        <option value="999" data-t="einst.zielAlles"></option>
      </select>
    </div>

    <h3 data-t="einst.sicherung"></h3>
    <p class="hinweis" data-t="einst.sicherungHinweis"></p>
    <button class="btn" id="btn-export" data-t="einst.export"></button>
    <button class="btn" id="btn-import" data-t="einst.import"></button>
    <input type="file" id="datei-import" accept=".json" hidden>

    <h3 data-t="einst.reset"></h3>
    <button class="btn btn-gefahr" id="btn-reset-kurs" data-t="einst.resetKnopf"></button>
    <button class="btn btn-gefahr" id="btn-reset" data-t="einst.resetAlles"></button>

    <h3 data-t="einst.stand"></h3>
    <p class="hinweis" id="inhalt-stand"></p>
    <p class="hinweis" data-t="einst.standHinweis"></p>
  </section>

</main>

<!-- =================== MENÜ =================== -->
<!-- Meldung, wenn eine neue Fassung bereitliegt -->
<div id="neue-fassung" hidden>
  <span data-t="update.da"></span>
  <button class="btn-fassung" id="btn-fassung-laden" data-t="update.laden"></button>
  <button class="btn-fassung-leise" id="btn-fassung-spaeter" data-t="update.spaeter"></button>
</div>

<nav id="menue" hidden>
  <button data-ziel="start" data-t="menue.start"></button>
  <button data-ziel="kurse" data-t="menue.kurse"></button>
  <button data-ziel="historie" data-t="menue.historie"></button>
  <button data-ziel="erinnerung" data-t="menue.erinnerung"></button>
  <button data-ziel="einstellungen" data-t="menue.einstellungen"></button>
</nav>
<div id="menue-schatten" hidden></div>

<!-- =================== SKRIPTE =================== -->

     1. Speicher und Kursverwaltung
     2. Kursdefinitionen (damit LEKTION(...) die Kurse kennt)

<script src="js/speicher.js"></script>
<script src="js/kurse.js"></script>
<script src="js/texte.js"></script>
<script src="js/kurs-definitionen.js"></script>

<script src="data/es-es/lektionen-01-10.js"></script>

<script src="data/de/lektionen-01-10.js"></script>

<script src="data/de/lektionen-21-30.js"></script>
<script src="data/de/lektionen-31-40.js"></script>
<script src="data/de/lektionen-41-50.js"></script>

<script src="data/de-beruf/lektionen-01-08.js"></script>
<script src="data/de-beruf/lektionen-09-16.js"></script>
<script src="data/de-beruf/lektionen-17-24.js"></script>

<script src="js/daten.js"></script>
<script src="js/srs.js"></script>
<script src="js/sprache.js"></script>

<script src="js/statistik.js"></script>
<script src="js/tagesplan.js"></script>
<script src="js/teilen.js"></script>
<script src="js/pruefungen.js"></script>
<script src="js/pruefung-ui.js"></script>
<script src="data/pruefungen/de-a1.js"></script>
<script src="data/pruefungen/de-a2.js"></script>
<script src="data/pruefungen/de-b1.js"></script>
<script src="data/pruefungen/de-b2.js"></script>
<script src="data/pruefungen/de-beruf-1.js"></script>
<script src="data/pruefungen/de-beruf-2.js"></script>
<script src="data/pruefungen/es-419-a2.js"></script>
<script src="data/pruefungen/es-419-b1.js"></script>
<script src="data/pruefungen/es-419-b2.js"></script>

<script src="data/pruefungen/es-es-b1.js"></script>
<script src="js/app.js"></script>
</body>
</html>
